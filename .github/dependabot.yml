# Keeps dependencies current without flooding the pull request list.
#
# Patch and minor npm updates are grouped into one weekly pull request so they
# can be reviewed and merged together; major versions stay separate because they
# need their own migration. GitHub Actions versions are checked monthly.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
